plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'br.com.jumplab'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "br.com.jumplab.deteccaopose"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  // O modelo empacotado nao pode ser comprimido: o MediaPipe le o arquivo direto do APK.
  androidResources {
    noCompress += ["task"]
  }
}

dependencies {
  // MediaPipe Pose Landmarker, Apache 2.0 (spec 018, research R1).
  implementation "com.google.mediapipe:tasks-vision:1.2.3"
}
